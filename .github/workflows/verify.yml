name: Verify plugin

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { type: IntellijIdea, version: '2026.2' }
          - { type: IntellijIdea, version: '2026.3' }
          - { type: PyCharm, version: '2026.3' }
          - { type: WebStorm, version: '2026.3' }
          - { type: PhpStorm, version: '2026.3' }
          - { type: GoLand, version: '2026.3' }
          - { type: CLion, version: '2026.3' }
          - { type: RubyMine, version: '2026.3' }
          - { type: DataGrip, version: '2026.3' }
          - { type: RustRover, version: '2026.3' }
          - { type: Rider, version: '2026.2.4.1' }
    name: ${{ matrix.type }} ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: >-
          ./gradlew check verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin buildPlugin
          -PverificationType=${{ matrix.type }} -PverificationVersion=${{ matrix.version }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plugin-validation-${{ matrix.type }}-${{ matrix.version }}
          path: |
            build/distributions/*.zip
            build/reports/**
