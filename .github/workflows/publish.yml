name: Publish plugin

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed plugin to JetBrains Marketplace
        type: boolean
        default: false
        required: true

jobs:
  verify:
    if: ${{ inputs.publish }}
    uses: ./.github/workflows/verify.yml
  publish:
    if: ${{ inputs.publish }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify release
        run: ./gradlew check verifyPluginProjectConfiguration verifyPluginStructure buildPlugin
      - name: Sign and verify signature
        run: |
          test -n "$CERTIFICATE_CHAIN" && test -n "$PRIVATE_KEY" && test -n "$PUBLISH_TOKEN"
          ./gradlew signPlugin verifyPluginSignature
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      - name: Publish verified release
        run: ./gradlew publishPlugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
